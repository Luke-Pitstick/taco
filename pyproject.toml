[project]
name = "taco"
version = "0.3.0"
description = "Create discoverable, durable Jupyter kernels for Python environments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Luke Pitstick" },
]
keywords = ["jupyter", "kernel", "notebook", "uv", "poetry", "conda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jupyter-core>=5.7",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/Luke-Pitstick/taco"
Issues = "https://github.com/Luke-Pitstick/taco/issues"
Repository = "https://github.com/Luke-Pitstick/taco.git"

[project.scripts]
taco = "taco.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taco"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
markers = [
    "integration: full end-to-end tests requiring real environments and live kernels",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/taco/cli.py" = ["B008"]
